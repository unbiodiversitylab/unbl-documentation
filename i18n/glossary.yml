# UNBL documentation glossary
#
# The single source of truth for terminology across English, Spanish, French,
# Portuguese and Russian. Used by translators, reviewers and Claude
# (/translate, the translation-reviewer agent).
#
# Seeded in Nov 2026 from terms already used in docs/ and the mkdocs.yml
# nav_translations. Translators: please correct and extend this file. When a
# term changes here, the old wording in existing pages should be updated too.
#
# Fields:
#   en/es/fr/pt/ru  preferred translation
#   note            usage guidance
#   avoid           wordings that must not be used (with reason)

# --------------------------------------------------------------------------
# Never translate. Keep exactly as written in every language.
# --------------------------------------------------------------------------
do_not_translate:
  - term: UN Biodiversity Lab
    note: >-
      The product name stays in English in every language, also in running text
      ("el sitio web del UN Biodiversity Lab", "o UN Biodiversity Lab"). Confirmed
      Nov 2026 (#42). In Russian, where a gendered word must agree with it, write
      «платформа UN Biodiversity Lab».
  - term: UNBL
  - term: ELSA
    note: >-
      Never translated (confirmed Nov 2026, #42). Its expansion may be
      translated (see below).
  - term: DPG
    note: Keep the acronym; translate the expansion "Digital Public Good" (see below).
  - term: GeoTIFF
  - term: UI labels shown in capitals
    note: >-
      Buttons and menu labels as they appear in the interface ('PLACES',
      'NEW ANALYSIS RUN', 'CREATE NEW METRIC') stay in English because the
      interface may show them in English. Add a translation in brackets the
      first time on a page, e.g. FR: « NEW ANALYSIS RUN » (NOUVELLE ANALYSE).
  - term: Markdown and MkDocs syntax
    note: "!!! note, {#fig-id}, image paths, URLs, anchors (#...), file names."

