# Conda/mamba environment for local preview. Package versions come from
# requirements.txt, so there is only one list to maintain.
#   mamba env create -f environment-mkdocs.yaml
#   mamba activate unbl-mkdocs
name: unbl-mkdocs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt
